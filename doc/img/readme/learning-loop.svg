<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="248" viewBox="0 0 1440 248"><defs></defs><rect width="1440" height="248" fill="#0b1018"/><text x="42" y="52" fill="#e1bd7b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">01</text><text x="42" y="114" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">EXPLORE</text><text x="42" y="163" fill="#a4adba" font-family="Arial, Helvetica, sans-serif" font-size="20" >Read the room. Connect the clues.</text><path d="M42 207H436" stroke="#303b4c"/><text x="522" y="52" fill="#e1bd7b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">02</text><text x="522" y="114" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">EXPERIMENT</text><text x="522" y="163" fill="#a4adba" font-family="Arial, Helvetica, sans-serif" font-size="20" >Try an idea. See what changes.</text><path d="M522 207H916" stroke="#303b4c"/><text x="1002" y="52" fill="#e1bd7b" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3">03</text><text x="1002" y="114" fill="#f5f1e8" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="800">UNDERSTAND</text><text x="1002" y="163" fill="#a4adba" font-family="Arial, Helvetica, sans-serif" font-size="20" >Turn a solution into a new insight.</text><path d="M1002 207H1396" stroke="#303b4c"/></svg>