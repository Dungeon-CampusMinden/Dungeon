name: dungeon-tracking

services:
  database:
    image: postgres:18.6-alpine3.23@sha256:697c180dbf244d3ce4a8f4cbc0156cde840af055c1bf8b76aebe422a4822086f
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/dungeon-tracking-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_DB: dungeon_tracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DUNGEON_TRACKING_POSTGRES_PASSWORD:?Set DUNGEON_TRACKING_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      DUNGEON_TRACKING_OWNER_DATABASE_PASSWORD: ${DUNGEON_TRACKING_OWNER_DATABASE_PASSWORD:?Set DUNGEON_TRACKING_OWNER_DATABASE_PASSWORD}
      DUNGEON_TRACKING_RUNTIME_DATABASE_PASSWORD: ${DUNGEON_TRACKING_RUNTIME_DATABASE_PASSWORD:?Set DUNGEON_TRACKING_RUNTIME_DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    configs:
      - source: postgres_entrypoint
        target: /usr/local/bin/dungeon-tracking-entrypoint.sh
        mode: 0555
      - source: postgres_init
        target: /docker-entrypoint-initdb.d/10-tracking-roles.sh
        mode: 0555
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dungeon_tracking"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  migrate:
    image: dungeon-tracking-backend:1
    build:
      context: ..
      dockerfile: tracking/backend/Dockerfile
    init: true
    depends_on:
      database:
        condition: service_healthy
        restart: true
    entrypoint:
      ["java", "-cp", "/opt/dungeon-tracking/lib/*", "tracking.backend.TrackingMigrate"]
    environment:
      DUNGEON_TRACKING_DATABASE_URL: jdbc:postgresql://database:5432/dungeon_tracking
      DUNGEON_TRACKING_DATABASE_USER: dungeon_tracking_owner
      DUNGEON_TRACKING_DATABASE_PASSWORD: ${DUNGEON_TRACKING_OWNER_DATABASE_PASSWORD:?Set DUNGEON_TRACKING_OWNER_DATABASE_PASSWORD}
      DUNGEON_TRACKING_RUNTIME_DATABASE_USER: dungeon_tracking_runtime
    networks:
      - database
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  backend:
    image: dungeon-tracking-backend:1
    build:
      context: ..
      dockerfile: tracking/backend/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DUNGEON_TRACKING_BIND_HOST: 0.0.0.0
      DUNGEON_TRACKING_PORT: "8088"
      DUNGEON_TRACKING_DATABASE_URL: jdbc:postgresql://database:5432/dungeon_tracking
      DUNGEON_TRACKING_DATABASE_USER: dungeon_tracking_runtime
      DUNGEON_TRACKING_DATABASE_PASSWORD: ${DUNGEON_TRACKING_RUNTIME_DATABASE_PASSWORD:?Set DUNGEON_TRACKING_RUNTIME_DATABASE_PASSWORD}
      DUNGEON_TRACKING_API_KEY: ${DUNGEON_TRACKING_API_KEY:-}
    ports:
      - "127.0.0.1:8088:8088"
    networks:
      - database
      - api
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        ["CMD", "java", "-cp", "/opt/dungeon-tracking/lib/*", "tracking.backend.TrackingHealthCheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  database:
    internal: true
  api:

volumes:
  postgres_data:

configs:
  postgres_entrypoint:
    file: ./backend/docker/postgres-entrypoint.sh
  postgres_init:
    file: ./backend/docker/postgres-init.sh
