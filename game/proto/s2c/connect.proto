// Connection response messages.

syntax = "proto3";

package dungeon.s2c;

option java_multiple_files = true;
option java_package = "engine.network.proto.s2c";
option java_outer_classname = "ConnectProto";

// Server-to-client: Connection acknowledged.
// Maps to: engine.network.messages.s2c.ConnectAck
message ConnectAck {
  // Assigned client ID.
  int32 client_id = 1;

  // Assigned session ID.
  int32 session_id = 2;

  // Assigned session token for reconnection.
  bytes session_token = 3;

  // Stable room ID used only for client-local played-before history.
  string tracking_room_id = 4;
}

// Server-to-client: Connection rejected.
// Maps to: engine.network.messages.s2c.ConnectReject
message ConnectReject {
  // Reason for rejection.
  RejectReason reason = 1;

  enum RejectReason {
    REJECT_REASON_UNSPECIFIED = 0;
    REJECT_REASON_INVALID_NAME = 1;
    REJECT_REASON_INCOMPATIBLE_VERSION = 2;
    REJECT_REASON_NO_SESSION_FOUND = 3;
    REJECT_REASON_INVALID_SESSION_TOKEN = 4;
    REJECT_REASON_OTHER = 5;
    REJECT_REASON_SERVER_FULL = 6;
    REJECT_REASON_NAME_IN_USE = 7;
    REJECT_REASON_CHARACTER_UNAVAILABLE = 8;
  }
}

// Server-to-client: character availability requested before authentication.
// Maps to: engine.network.messages.s2c.CharacterOptions
message CharacterOptions {
  repeated Option characters = 1;

  message Option {
    // CharacterClass ordinal used by the existing connect protocol.
    int32 character_class_id = 1;
    // Maximum admitted players, or -1 for unlimited.
    int32 max_count = 2;
    // Current named reservations for this class.
    int32 player_count = 3;
    // Whether the requesting player can select this class.
    bool selectable = 4;
    // Whether this is the requesting player's saved assignment.
    bool assigned = 5;
  }
}

// Server-to-client: Marks the end of the initial level/entity bootstrap stream.
// Maps to: engine.network.messages.s2c.InitialWorldComplete
message InitialWorldComplete {}
