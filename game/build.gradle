plugins {
    id 'java-library'
    id 'com.google.protobuf'
    id 'application'
    id 'org.beryx.runtime' version "${beryxRuntimeVersion}"
}

application {
    mainClass = 'engine.starter.BasicStarter'
    applicationName = 'game'
}

dependencies {
    api project(':tracking:core')

    // LibGDX: expose this API to users because of engine.level.elements.ILevel
    api supportDependencies.gdx
    api supportDependencies.gdx_platform
    api supportDependencies.gdx_backend_lwjgl3
    api supportDependencies.gdx_ai
    api supportDependencies.gdx_freetype
    api supportDependencies.gdx_freetype_platform
    api supportDependencies.gdx_backend_headless
    api supportDependencies.gdx_controllers
    api supportDependencies.gdx_controllers_desktop

    // Netty for server-client communication
    implementation supportDependencies.netty_all

    // Protobuf for network serialization
    api supportDependencies.protobuf_java
    implementation supportDependencies.protobuf_java_util

    // JUnit and Mockito for testing
    testImplementation supportDependencies.junit
    testImplementation supportDependencies.junitLauncher
    testRuntimeOnly supportDependencies.junitLauncher
    testImplementation supportDependencies.mockito_core
    testImplementation "com.badlogicgames.gdx:gdx-backend-lwjgl:1.14.2"
    testImplementation("com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion")
    testImplementation("com.badlogicgames.gdx:gdx:$gdxVersion")
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { }
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['src/', "$buildDir/generated/sources/proto/main/java"]
        }
        resources {
            srcDirs = ['assets/']
        }
        proto {
            srcDir 'proto'
        }
    }
    test {
        java {
            srcDirs = ['test/']
        }
        resources {
            srcDirs = ['test_assets/']
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateProto'
}

tasks.register('runBasicStarter', JavaExec) {
    group 'starter'
    mainClass = 'engine.starter.BasicStarter'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('debugBasicStarter', JavaExec) {
    group 'starter'
    mainClass = 'engine.starter.BasicStarter'
    classpath = sourceSets.main.runtimeClasspath
    debug = true
}

tasks.register('runMPServer', JavaExec) {
    group 'starter'
    mainClass = 'engine.starter.MultiplayerServer'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runMPClient', JavaExec) {
    group 'starter'
    mainClass = 'engine.starter.MultiplayerClient'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runSpriteTestRoom', JavaExec) {
    group 'starter'
    mainClass = 'rooms.demo.SpriteTestRoom'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runMushRoom', JavaExec) {
    group 'starter'
    mainClass = 'rooms.mushroom.MushRoom'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runGameOfGames', JavaExec) {
    group 'starter'
    mainClass = 'rooms.gameofgames.GameOfGames'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runGameOfGamesLevelEditor', JavaExec) {
    group 'starter'
    mainClass = 'rooms.gameofgames.GameOfGames'
    classpath = sourceSets.main.runtimeClasspath
    args '--leveleditor'
}

tasks.register('runTheLastHour', JavaExec) {
    group 'starter'
    mainClass = 'rooms.lasthour.starter.TheLastHour'
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('runTheLastHourLevelEditor', JavaExec) {
    group 'starter'
    mainClass = 'rooms.lasthour.starter.TheLastHour'
    classpath = sourceSets.main.runtimeClasspath
    args '--leveleditor'
}

tasks.register('runTheLastHourServer', JavaExec) {
    group 'starter'
    mainClass = 'rooms.lasthour.starter.TheLastHour'
    classpath = sourceSets.main.runtimeClasspath
    args '--server'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('checkstyleMain') {
    exclude 'build/generated/source/proto/**'
    exclude '**/engine/network/proto/**'
}

tasks.named('checkstyleTest') {
    exclude 'build/generated/source/proto/**'
    exclude '**/engine/network/proto/**'
}

/*
    this task creates the jar files based on compiled classes from .java files and assets( comes from java-library plugin)
    manifest attribute is set to the main class of the project.
    It provides the main class information to jpackage for creating the native executable
*/
tasks.named('jar', Jar) {
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('buildDemoRoom', Jar) {
    group = 'jar'
    dependsOn configurations.runtimeClasspath
    archiveBaseName.set('EscaperoomDemo')
    archiveFileName.set('EscapeRoomDemo.jar')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes 'Main-Class': 'rooms.mushroom.MushRoom'
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}

tasks.register('buildTheLastHourJar', Jar) {
    group = 'jar'
    dependsOn configurations.runtimeClasspath
    archiveBaseName.set('TheLastHour')
    archiveFileName.set('TheLastHour.jar')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes 'Main-Class': 'rooms.lasthour.starter.TheLastHour'
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}

tasks.register('buildTheLastHourServerJar', Jar) {
    group = 'jar'
    dependsOn configurations.runtimeClasspath
    archiveBaseName.set('TheLastHourServer')
    archiveFileName.set('TheLastHourServer.jar')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    from(resources.text.fromString('server')) {
        rename { 'application.properties' }
    }

    manifest {
        attributes 'Main-Class': 'rooms.lasthour.starter.TheLastHour'
    }

    exclude('META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA')
}

tasks.register('installTheLastHourDist', Sync) {
    group = 'build'
    dependsOn tasks.named('buildTheLastHourJar')

    into layout.buildDirectory.dir('installTheLastHour/theLastHour/lib')
    from tasks.named('buildTheLastHourJar')
    from configurations.runtimeClasspath
}

tasks.register('installTheLastHourServerDist', Sync) {
    group = 'build'
    dependsOn tasks.named('buildTheLastHourServerJar')

    into layout.buildDirectory.dir('installTheLastHourServer/theLastHourServer/lib')
    from tasks.named('buildTheLastHourServerJar')
    from configurations.runtimeClasspath
}

def configureTheLastHourJpackageImage(
    task,
    installTask,
    inputDirPath,
    appName,
    mainJar,
    appArgs = []
) {
    task.group = 'build'
    task.dependsOn 'jre', installTask

    def os = System.getProperty('os.name').toLowerCase()
    def javaHome = System.getProperty('java.home')
    def jpackageExe = "${javaHome}/bin/jpackage${os.contains('windows') ? '.exe' : ''}"
    def inputDir = layout.buildDirectory.dir(inputDirPath).get().asFile
    def jreDir = layout.buildDirectory.dir('jre').get().asFile
    def outputDir = layout.buildDirectory.dir('jpackage').get().asFile
    def options = [
        '--type', 'app-image',
        '--name', appName,
        '--dest', outputDir.absolutePath,
        '--input', inputDir.absolutePath,
        '--main-jar', mainJar,
        '--main-class', 'rooms.lasthour.starter.TheLastHour',
        '--runtime-image', jreDir.absolutePath
    ]
    appArgs.each { arg ->
        options += ['--arguments', arg]
    }

    task.doFirst {
        project.delete(new File(outputDir, appName))
        project.delete(new File(outputDir, "${appName}.app"))
    }
    task.commandLine([jpackageExe] + options)
}

tasks.register('jpackageImageTheLastHour', Exec) {
    configureTheLastHourJpackageImage(
        it,
        tasks.named('installTheLastHourDist'),
        'installTheLastHour/theLastHour/lib',
        'TheLastHour',
        'TheLastHour.jar'
    )
}

tasks.register('jpackageImageTheLastHourServer', Exec) {
    configureTheLastHourJpackageImage(
        it,
        tasks.named('installTheLastHourServerDist'),
        'installTheLastHourServer/theLastHourServer/lib',
        'TheLastHourServer',
        'TheLastHourServer.jar',
        ['--server']
    )
}

tasks.register('jpackageImageTheLastHourAll') {
    group = 'build'
    dependsOn tasks.named('jpackageImageTheLastHour')
    dependsOn tasks.named('jpackageImageTheLastHourServer')
}

tasks.register('generateLauncherProperties') {
    def launchersDir = layout.buildDirectory.dir('jpackage-launchers')
    outputs.dir(launchersDir)

    doLast {
        def outputDir = launchersDir.get().asFile
        outputDir.mkdirs()

        def launchers = [
            [name: 'SpriteTestRoom', mainClass: 'rooms.demo.SpriteTestRoom'],
            [name: 'MushRoom', mainClass: 'rooms.mushroom.MushRoom'],
            [name: 'GameOfGames', mainClass: 'rooms.gameofgames.GameOfGames']
        ]

        launchers.each { launcher ->
            def propertiesFile = new File(outputDir, "${launcher.name}.properties")
            propertiesFile.text = """main-class=${launcher.mainClass}
app-name=${launcher.name}
"""
        }
    }
}

/*
    "Uses the jpackage tool to create a platform-specific application image.
    depends on: runtime"

    - installDist is a task called from jpackageImage task. it uses the jar files to create a proper directory structure with all necessary jar files and assets
    - packageImage task (from org.beryx.runtime plugin) uses the JDK's jpackage tool (configured in the runtime.jpackage block) to create the executable of project with bundled JRE
 */
tasks.named('jpackageImage') {
    dependsOn 'installDist'
    dependsOn 'generateLauncherProperties'
}


/*
    "Creates an image containing your application, a custom JRE, and appropriate start scripts.
    If the property distDir is not set, this task depends on either installDist or installShadowDist"

    runtime(Config Block)
    Configuration block for org.beryx.runtime plugin(Java Badass Runtime)
    This plugin creates a custom JRE (using jlink) and packages it with the application (using jpackage)
*/
runtime {
    options = ['--strip-debug',
               '--compress', '2',
               '--no-header-files',
               '--no-man-pages',
               '--strip-native-commands',
               '--vm', 'server']

    // Java modules to include in the custom JRE (only these will be bundled, reducing size)
    modules = [
        'java.base',
        'java.desktop',
        'java.logging',
        'java.management',
        'java.naming',
        'jdk.unsupported',
        'jdk.zipfs'
    ]

    // Configuration for jpackage tool
    jpackage {

        // Directory containing all JARs (created by installDist task)    "../build/install/game/lib"
        def inputDir = layout.buildDirectory.dir("install/${application.applicationName}/lib").get().asFile

        def launchersDir = layout.buildDirectory.dir('jpackage-launchers').get().asFile

        // Options passed to jpackage tool (jpackage requires --input option to know where all jars are)
        imageOptions = [
            '--input', inputDir.absolutePath,
            '--add-launcher',
                "SpriteTestRoom=${launchersDir.absolutePath}/SpriteTestRoom.properties",
            '--add-launcher', "MushRoom=${launchersDir.absolutePath}/MushRoom.properties",
            '--add-launcher', "GameOfGames=${launchersDir.absolutePath}/GameOfGames.properties"
        ]

    }
}
