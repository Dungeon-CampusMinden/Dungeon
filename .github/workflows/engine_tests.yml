name: Engine Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: Engine unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run engine tests
        run: bash ./gradlew --no-daemon --console=plain :game:test --tests 'engine.*'

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-reports
          path: |
            game/build/reports/tests/test/
            game/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
