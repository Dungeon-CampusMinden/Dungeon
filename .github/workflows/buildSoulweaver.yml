name: Build and Release Soulweaver

on:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'gradle'
            - name: Make gradlew executable
              run: chmod +x gradlew
            - name: Build Soulweaver JAR
              run: ./gradlew :game:buildSoulweaverJar
            - name: Upload JAR
              uses: actions/upload-artifact@v7
              with:
                  name: Soulweaver-JAR
                  path: game/build/libs/Soulweaver.jar
                  if-no-files-found: error

    buildExecutables:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      platform_name: win-x86_64
                    - os: ubuntu-latest
                      platform_name: linux-x86_64
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - name: Set up JDK 25
              uses: actions/setup-java@v6
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'gradle'
            - name: Make gradlew executable
              run: chmod +x gradlew
            - name: Build Soulweaver app image
              run: ./gradlew :game:jpackageImageSoulweaver
            - name: Archive Soulweaver
              shell: bash
              run: |
                  if [ "${{ runner.os }}" == "Windows" ]; then
                    7z a Soulweaver-${{ matrix.platform_name }}.zip ./game/build/jpackage/Soulweaver
                  else
                    tar -czf Soulweaver-${{ matrix.platform_name }}.tar.gz -C game/build/jpackage Soulweaver
                  fi
            - name: Upload app image
              uses: actions/upload-artifact@v7
              with:
                  name: Soulweaver-${{ matrix.platform_name }}
                  path: Soulweaver-*
                  if-no-files-found: error

    deploy:
        needs: [build, buildExecutables]
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  merge-multiple: true
            - name: Create draft GitHub release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  TAG="soulweaver-v1.0.${{ github.run_number }}"
                  gh release create "$TAG" *.jar *.zip *.tar.gz \
                    --target "${{ github.sha }}" \
                    --title "Das Erbe der Seelenweber (Programming Escape Room)" \
                    --notes-file ".github/workflows/releaseInstructionsSoulweaver.md" \
                    --draft=true \
                    --prerelease=false
