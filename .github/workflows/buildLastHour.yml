name: Build and Release Last Hour

on:
    workflow_dispatch:
jobs:
    build:
        uses: ./.github/workflows/buildRelease.yml
        with:
            game: TheLastHour
        secrets:
            DUNGEON_TRACKING_ENDPOINT: ${{ secrets.DUNGEON_TRACKING_ENDPOINT }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  merge-multiple: true

            - name: Create GitHub Release
              run: |
                  TAG="v1.0.${{ github.run_number }}"
                  gh release create "$TAG" *.jar *.zip *.tar.gz \
                    --title "The Last Hour (Cyber Security Escape Room)" \
                    --notes-file ".github/workflows/releaseInstructionsLastHour.md" \
                    --draft=true \
                    --prerelease=false
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
