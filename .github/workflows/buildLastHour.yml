name: Build and Release Last Hour

on:
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            # Java Setup
            - name: Set up JDK 25
              uses: actions/setup-java@v5
              with:
                  java-version: '25'
                  distribution: 'temurin'
                  cache: 'gradle'

            - name: Make gradlew executable
              run: chmod +x gradlew

            - name: Build JARs with Gradle
              run: ./gradlew :game:buildTheLastHourJar

            - name: Upload Build Artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: TheLastHour-JAR
                  path: game/build/libs/TheLastHour.jar
                  if-no-files-found: error

    buildExecutables:
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      platform_name: win-x86_64
                    - os: ubuntu-latest
                      platform_name: linux-x86_64
        steps:
            -   name: Checkout Code
                uses: actions/checkout@v7

            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    java-version: '25'
                    distribution: 'temurin'
                    cache: 'gradle'
            -   name: Make gradlew executable
                run: chmod +x gradlew

            -   name: Build last hour
                run: ./gradlew :game:jpackageImageTheLastHour

            -   name: Archive The Last Hour
                run: |
                    if [ "${{ runner.os }}" == "Windows" ]; then
                      7z a TheLastHour-${{ matrix.platform_name }}.zip ./game/build/jpackage/TheLastHour
                    else
                      tar -czf TheLastHour-${{ matrix.platform_name }}.tar.gz -C game/build/jpackage TheLastHour
                    fi
                shell: bash

            -   name: Upload Artifacts
                uses: actions/upload-artifact@v7
                with:
                    name: TheLastHour-${{ matrix.platform_name }}
                    path: TheLastHour-*
                    if-no-files-found: error
    deploy:
        needs: [build, buildExecutables]
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  merge-multiple: true

            - name: Create GitHub Release
              run: |
                  TAG="v1.0.${{ github.run_number }}"
                  gh release create "$TAG" *.jar *.zip *.tar.gz \
                    --title "The Last Hour (Cyber Security Escape Room)" \
                    --notes-file ".github/workflows/releaseInstructionsLastHour.md" \
                    --draft=true \
                    --prerelease=false
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
